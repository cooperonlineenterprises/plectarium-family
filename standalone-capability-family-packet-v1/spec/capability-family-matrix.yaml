  - project_execution
  - external_process_execution
  - network
  - browser_execution
  - output_write
  - cache_write
  - temporary_write
  - credential_access
  project_execution: Often required to start a local application; every command must be planned.
  network: Denied by default; explicit origin allowlists and isolated test environments required.
  browser_execution: Core permission; browser profile, origins, storage, downloads, and outbound requests must be bounded.
  production_access: Production interaction disabled by default; read-only smoke checks require explicit authorization.
  likely_external_tools:
  - Playwright
  - axe-core
  - Lighthouse/Lighthouse CI
  - visual-diff engines
  - browser trace tooling
  durable_result_type: UI Assurance Bundle
  optional_upstream_results:
  - api-contract-assurance
  - verification-assurance
  downstream_consumers:
  - release-assurance
  - verification-assurance
  - specification-conformance
  mature_target: A reproducible multi-browser assurance engine with isolated sessions, journey plans, accessibility and performance
    checks, visual evidence, stable baselines, rich traces, and strict origin/credential controls.
  evaluation_focus:
  - known journey failures
  - accessibility near-misses
  - visual baseline stability
  - cross-browser variance
  - origin/network containment
  - secret and session isolation
  known_open_questions:
  - How should visual-diff tolerance be standardized?
  - What production smoke-test class is acceptable?
  - How should authenticated test credentials be brokered and redacted?
